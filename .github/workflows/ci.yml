name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install Python dependencies (locked)
        run: uv sync --frozen
      - name: Lint (ruff, blocking gate)
        run: uv run --frozen ruff check src tests
      - name: Run backend tests
        run: PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (locked)
        run: npm ci
      - name: Lint (eslint, blocking gate on errors)
        run: npm run lint
      - name: Type-check and build (tsc -b && vite build)
        run: npm run build
      - name: Run frontend tests
        run: npm run test:run
