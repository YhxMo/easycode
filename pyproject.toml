[project]
name = "easycode"
version = "0.1.0"
description = "Python CLI coding agent (Claude Code / opencode style)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.60",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[project.scripts]
easycode = "easycode.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Sources live directly in `src/`, so the directory name and the import name
# differ; package-dir is what maps one onto the other. Setuptools has no prefix
# rule to derive `easycode.<name>` from the tree, so every subpackage is listed
# here — a new one that is missing still imports when running from source, and
# only goes missing from a built wheel.
[tool.setuptools]
package-dir = { easycode = "src" }
packages = [
    "easycode",
    "easycode.agent",
    "easycode.extensions",
    "easycode.extensions.mcp",
    "easycode.models",
    "easycode.permissions",
    "easycode.permissions.sandbox",
    "easycode.tools",
    "easycode.ui",
    "easycode.web",
    "easycode.web.routes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/._*"]

[tool.ruff.lint]
select = [
    "E9",            # syntax-level errors
    "F",             # pyflakes: undefined names, unused imports/vars, f-string bugs
    "I",             # import sorting
    "UP",            # pyupgrade: modern syntax
    "C4",            # comprehension hygiene
    "RET",           # return hygiene
    "SIM",           # simplifications
    "RUF",           # ruff-specific: unused noqa, dangling asyncio task, ...
    "BLE",           # no blind except
    "S110", "S112",  # try-except-pass/continue
    "TRY004",        # isinstance checks raise TypeError, not ValueError
    "FLY",           # static join -> f-string
    "ISC",           # implicit string concat hygiene
    "PLW",           # pylint warnings (subprocess without check, ...)
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文注释/字符串的全角标点是有意为之
    "SIM105",                       # 取消路径的 try-except-pass 是有意的（部分改用 suppress）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF015", "RUF006"]  # 测试里 list()[0] 的 IndexError 语义本身就是断言的一部分；ensure_future 后台任务同理

[tool.ruff.lint.isort]
# `easycode` 的来源目录现在叫 `src`，ruff 无法从目录名推出这个包名。
known-first-party = ["easycode"]
