[project]
name = "easycode"
version = "0.1.0"
description = "Python CLI coding agent (Claude Code / opencode style)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.60",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mcp>=1.29,<2",
    "playwright>=1.62.0",
]

[project.scripts]
easycode = "easycode.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easycode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
